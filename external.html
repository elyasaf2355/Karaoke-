<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>מוזיקה חיצונית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>🔊 קריוקי ברמקול</h1>
  <nav class="nav"><a href="index.html">טיונר</a><a href="song.html">שיר</a><a href="external.html" class="cur">מוזיקה חיצונית</a></nav>

  <section class="controls">
    <label>סולם <select id="root"></select></label>
    <label>סוג <select id="scale"><option value="major">מז'ור</option><option value="minor">מינור</option></select></label>
  </section>

  <section class="display" id="display" data-state="idle">
    <div class="note" id="note">—</div>
    <div class="gauge" aria-hidden="true">
      <div class="zone"></div><div class="needle" id="needle"></div>
      <span class="tick l">נמוך</span><span class="tick r">גבוה</span>
    </div>
    <div class="message" id="message">הפעילו את הקריוקי ואז לחצו על התחלה</div>
    <div class="detail" id="detail"></div>
    <div class="score" id="score"></div>
  </section>

  <button id="toggle" class="start">התחלה</button>
  <button id="skip" class="secondary" hidden>דלגו על הכיול (בחרתי סולם ידנית)</button>
  <p class="hint">שלב 1: מפעילים מוזיקה ולא שרים כ־5 שניות, והאפליקציה לומדת את הרקע ומזהה את הסולם.<br>שלב 2: שרים. אפשר לתקן את הסולם ידנית בכל רגע.<br>האפליקציה לא מכירה את המנגינה, ולכן היא בודקת סולם ודיוק, לא אוקטבה.</p>
</main>
<script src="pitch.js"></script>
<script src="external.js"></script>
</body>
</html>
