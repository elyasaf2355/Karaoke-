<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>בודק זיופים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>🎤 בודק זיופים</h1>
  <nav class="nav"><a href="index.html" class="cur">טיונר חופשי</a><a href="song.html">שיר</a><a href="external.html">מוזיקה חיצונית</a></nav>

  <section class="controls">
    <label>סולם
      <select id="root"></select>
    </label>
    <label>סוג
      <select id="scale"></select>
    </label>
  </section>

  <section class="display" id="display" data-state="idle">
    <div class="note" id="note">—</div>
    <div class="gauge" aria-hidden="true">
      <div class="zone"></div>
      <div class="needle" id="needle"></div>
      <span class="tick l">נמוך</span><span class="tick r">גבוה</span>
    </div>
    <div class="message" id="message" aria-live="polite">לחצו על התחלה ושירו</div>
    <div class="detail" id="detail"></div>
  </section>

  <button id="toggle" class="start">התחלה</button>
  <p class="hint">הקול נשאר במכשיר שלכם ואינו נשלח לשום מקום.<br>עדיף להשתמש באוזניות חוטיות או בלי אוזניות.</p>
</main>
<script src="pitch.js"></script>
<script src="app.js"></script>
</body>
</html>
